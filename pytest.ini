[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_functions = test_*
addopts =
    --alluredir=allure-results
    --clean-alluredir
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --full-page-screenshot
markers =
    smoke: 核心正向冒烟场景，用于快速判断系统基本可用
    regression: 完整回归场景，包含异常验证和员工 CRUD
    db: 仅在本地 OrangeHRM 与 MariaDB 环境运行的数据库集成测试
    ui: 仅在本地 OrangeHRM 运行的 Playwright UI 冒烟测试

name: OrangeHRM integration tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  integration-tests:
    name: API, DB and UI integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ORANGEHRM_HOST_PORT: "8080"
      ORANGEHRM_DB_HOST_PORT: "3307"
      ORANGEHRM_DB_NAME: orangehrm
      ORANGEHRM_DB_USER: orangehrm
      ORANGEHRM_BASE_URL: http://127.0.0.1:8080
      ORANGEHRM_USERNAME: Admin
      ORANGEHRM_DB_HOST: 127.0.0.1
      ORANGEHRM_DB_PORT: "3307"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Generate disposable CI credentials
        run: |
          database_password="Db_$(openssl rand -hex 24)"
          root_password="Root_$(openssl rand -hex 24)"
          admin_password="CiA1!$(openssl rand -hex 24)"

          printf '::add-mask::%s\n' "$database_password"
          printf '::add-mask::%s\n' "$root_password"
          printf '::add-mask::%s\n' "$admin_password"

          {
            printf 'ORANGEHRM_DB_PASSWORD=%s\n' "$database_password"
            printf 'ORANGEHRM_DB_ROOT_PASSWORD=%s\n' "$root_password"
            printf 'ORANGEHRM_PASSWORD=%s\n' "$admin_password"
          } >> "$GITHUB_ENV"

      - name: Record runner tool versions
        run: |
          python --version
          docker version --format 'Docker client {{.Client.Version}}, server {{.Server.Version}}'
          docker compose version

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate CI environment and Compose configuration
        run: |
          required_variables=(
            ORANGEHRM_HOST_PORT
            ORANGEHRM_DB_HOST_PORT
            ORANGEHRM_DB_NAME
            ORANGEHRM_DB_USER
            ORANGEHRM_DB_PASSWORD
            ORANGEHRM_DB_ROOT_PASSWORD
            ORANGEHRM_BASE_URL
            ORANGEHRM_USERNAME
            ORANGEHRM_PASSWORD
            ORANGEHRM_DB_HOST
            ORANGEHRM_DB_PORT
          )
          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Missing required CI variable: $variable_name"
              exit 1
            fi
          done

          if [[ "$ORANGEHRM_BASE_URL" != "http://127.0.0.1:8080" ]]; then
            echo "::error::CI must target the runner-local OrangeHRM service"
            exit 1
          fi
          if [[ "$ORANGEHRM_DB_HOST" != "127.0.0.1" ]]; then
            echo "::error::CI must target the runner-local MariaDB service"
            exit 1
          fi

          # --quiet validates interpolation without printing expanded passwords.
          docker compose config --quiet

      - name: Start OrangeHRM and MariaDB
        run: docker compose up -d --wait --wait-timeout 180

      - name: Wait for the first-run installer
        run: |
          installer_ready=false
          for _ in {1..60}; do
            if curl --fail --silent --output /dev/null \
              "$ORANGEHRM_BASE_URL/installer/index.php/welcome"; then
              installer_ready=true
              break
            fi
            sleep 2
          done

          if [[ "$installer_ready" != true ]]; then
            echo "::error::OrangeHRM installer did not become HTTP-ready"
            exit 1
          fi

      - name: Initialize OrangeHRM 5.9
        run: |
          # OrangeHRM 5.9's new console command rejects --no-interaction.
          # The versioned 5.9 image still bundles this YAML-driven compatibility
          # installer and removes its plaintext config after a successful run.
          docker compose exec -T orangehrm sh -c \
            'rm -f /var/www/html/installer/cli_install_config.yaml && umask 077 && cat > /var/www/html/installer/cli_install_config.yaml' <<EOF
          database:
            hostName: db
            hostPort: 3306
            databaseName: $ORANGEHRM_DB_NAME
            privilegedDatabaseUser: $ORANGEHRM_DB_USER
            privilegedDatabasePassword: "$ORANGEHRM_DB_PASSWORD"
            useSameDbUserForOrangeHRM: y
            orangehrmDatabaseUser: ~
            orangehrmDatabasePassword: ~
            isExistingDatabase: y
            enableDataEncryption: n

          organization:
            name: OrangeHRM Quality Lab CI
            country: CN

          admin:
            adminUserName: $ORANGEHRM_USERNAME
            adminPassword: "$ORANGEHRM_PASSWORD"
            adminEmployeeFirstName: CI
            adminEmployeeLastName: Admin
            workEmail: ci-admin@example.test
            contactNumber: ~
            registrationConsent: false

          license:
            agree: y
          EOF

          installer_config_mode="$(docker compose exec -T orangehrm \
            stat -c '%a' /var/www/html/installer/cli_install_config.yaml)"
          if [[ "$installer_config_mode" != "600" ]]; then
            echo "::error::Transient installer config permissions are not 600"
            exit 1
          fi

          docker compose exec -T orangehrm \
            php /var/www/html/installer/cli_install.php
          docker compose exec -T orangehrm \
            sh -c 'test ! -e /var/www/html/installer/cli_install_config.yaml'

      - name: Verify installed application and database schema
        run: |
          login_ready=false
          final_url=""
          for _ in {1..60}; do
            if final_url="$(curl --fail --location --silent --show-error \
              --output /dev/null --write-out '%{url_effective}' \
              "$ORANGEHRM_BASE_URL/web/index.php/auth/login")"; then
              if [[ "$final_url" =~ /web/index\.php/auth/login/?$ ]]; then
                login_ready=true
                break
              fi
            fi
            sleep 2
          done

          if [[ "$login_ready" != true ]]; then
            echo "::error::OrangeHRM did not reach the installed login page"
            exit 1
          fi

          schema_count="$(docker compose exec -T \
            -e MYSQL_PWD="$ORANGEHRM_DB_PASSWORD" db \
            mariadb --user="$ORANGEHRM_DB_USER" \
            --database="$ORANGEHRM_DB_NAME" --batch --skip-column-names \
            --execute="SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = '$ORANGEHRM_DB_NAME' AND table_name = 'hs_hr_employee';")"
          if [[ "$schema_count" != "1" ]]; then
            echo "::error::Expected OrangeHRM database schema was not created"
            exit 1
          fi

      - name: Run complete test suite
        timeout-minutes: 15
        run: >-
          python -B -m pytest -v -p no:cacheprovider --strict-markers
          --browser chromium --junitxml=pytest-results.xml

      - name: Confirm complete results with no skips
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
          test_count = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
          skipped_count = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)

          if test_count == 0:
              raise SystemExit("pytest did not execute any tests")
          if skipped_count:
              raise SystemExit(f"pytest skipped {skipped_count} test(s) in CI")

          allure_results = list(Path("allure-results").glob("*-result.json"))
          allure_statuses = {
              json.loads(result.read_text(encoding="utf-8"))["status"]
              for result in allure_results
          }
          if len(allure_results) != test_count or allure_statuses != {"passed"}:
              raise SystemExit(
                  "Allure results do not match the successful pytest session"
              )

          print(
              f"Verified {test_count} executed tests with zero skips "
              "and complete passed Allure results"
          )
          PY

      - name: Show bounded container diagnostics
        if: ${{ failure() }}
        run: |
          docker compose ps --all || true
          docker compose logs --no-color --tail 200 db || true
          docker compose logs --no-color --tail 200 orangehrm || true

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 3

      - name: Remove runner-local containers and volumes
        if: ${{ always() }}
        run: docker compose down --volumes --remove-orphans
